name: Deploy All Projects to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment folder (auto-detect all projects)
        run: |
          mkdir -p _site
          [ -f index.html ] && cp index.html _site/ || true
          for d in */; do
            dir_name="${d%/}"
            if [[ "$dir_name" != ".git" && "$dir_name" != ".github" && "$dir_name" != "node_modules" && "$dir_name" != "_site" ]]; then
              echo "✅ Detected project folder: $dir_name - copying..."
              cp -r "$dir_name" "_site/"
            fi
          done
          echo "📂 Contents of _site:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
