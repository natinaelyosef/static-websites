name: Deploy Perfume to Pages

on:
  push:
    branches: ["main"]
    paths:                         # ✅ correct indentation (sub-key of push)
      - "Perfume/**"
  workflow_dispatch:               # ✅ separate event

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: "Perfume"        # ✅ no leading slash
          branch: gh-pages
          clean: false             # ✅ keep both folders
