name: Deploy JEWELRY STORE to Pages

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: "JEWELRY STORE"   # ✅ quoted because of space
          branch: gh-pages
          clean: false              # ✅ do NOT delete existing files
